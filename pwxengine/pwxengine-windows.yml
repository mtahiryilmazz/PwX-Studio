name: PwX Engine Windows CI

on:
  push:
    paths:
      - 'pwxengine/**'
      - '.github/workflows/pwxengine-windows.yml'
  pull_request:
    paths:
      - 'pwxengine/**'
      - '.github/workflows/pwxengine-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-logic:
    # Windows gerektirmeyen hızlı kontrol: PS7 GUI host çıkış kodu ve argüman bağlama mantığı
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GUI host logic tests
        shell: pwsh
        run: ./pwxengine/tests/Test-GuiHostLogic.ps1

  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify build environment
        shell: pwsh
        run: ./pwxengine/scripts/Check-Environment.ps1
      - name: Run PS51 and PS7 smoke tests (including PS7 single-file publish)
        shell: pwsh
        run: ./pwxengine/tests/Run-Smoke.ps1 -Target All -SingleFile
      - name: Upload test artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwxengine-test-results
          path: |
            pwxengine/artifacts/test-results/**/*.log
            pwxengine/artifacts/**/*.log
          if-no-files-found: ignore
